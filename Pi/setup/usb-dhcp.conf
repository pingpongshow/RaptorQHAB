# DHCP for the USB link, and nothing else.
#
# Read by raptorhab-usb-dhcp.service as its *only* configuration file, so
# nothing in /etc/dnsmasq.conf or /etc/dnsmasq.d applies and this cannot be
# altered by the distribution's own dnsmasq setup. The first attempt at this
# used a drop-in under /etc/dnsmasq.d and enabled the system dnsmasq service:
# the drop-in was not read (dnsmasq bound port 53 despite port=0 below) and
# enabling that service would have turned the payload into a DNS server on
# every interface it has.
#
# Why any of this: without DHCP the payload holds 10.55.0.1 while the host
# self-assigns 169.254.x.x, so they share a cable but not a subnet.
# `ssh raptorhab.local` works anyway over IPv6 link-local; `ssh 10.55.0.1` --
# the obvious thing to try -- does not.

# DHCP only. No DNS, no port 53.
port=0

# usb0 and nothing else. bind-dynamic rather than bind-interfaces because the
# gadget interface appears after this service starts; bind-interfaces would
# fail at boot and stay dead.
interface=usb0
bind-dynamic

# One host is ever plugged into this cable.
dhcp-range=10.55.0.10,10.55.0.20,255.255.255.0,12h

# These three are deliberately empty, and are the whole reason this is safe to
# run on someone's desk:
#
#   3  router      -- sending one would route the operator's internet traffic
#                     down a USB cable into a payload that does not forward it.
#   6  DNS         -- the payload is not a resolver; offering it would break
#                     name resolution on the host.
#   42 NTP         -- the payload has no RTC and is the last thing that should
#                     be telling a laptop what time it is.
dhcp-option=3
dhcp-option=6
dhcp-option=42

# Nothing to log to disk on a card with limited writes.
log-facility=-
