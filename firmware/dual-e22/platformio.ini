; RaptorHAB Dual-900 firmware/gs-modem
; PingPong Dual RF board (ESP32-S3-WROOM-1U-N16R8) with TWO E22-900M30S modules.
;
; Slot A and Slot B both carry SX1262 at 915 MHz:
;   Slot B  — RAPTOR GFSK image/telemetry downlink (replaces the Heltec T190)
;   Slot A  — Meshtastic LoRa, receive and transmit
;
; Slot A requires the 433 MHz low-pass filter to have been bypassed. See
; README.md; the firmware warns loudly at boot if the build has not confirmed it.

[env:raptorhab_dual_e22]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
; N16R8: 16 MB flash, 8 MB octal PSRAM
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB

build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_HAS_PSRAM
    -DCORE_DEBUG_LEVEL=0
    ; Set to 1 once L2/L4/L6 are links and C1/C3/C5/C7 are removed on slot A.
    ; Left at 0 the firmware still runs, but says on every boot that slot A is
    ; roughly 60 dB down and will hear and say nothing at 915 MHz.
    -DSLOT_A_FILTER_BYPASSED=1

lib_deps =
    jgromes/RadioLib@^6.4.0

monitor_speed = 921600
upload_speed = 921600
monitor_filters = esp32_exception_decoder
