; RaptorHab Ground Station Modem
;
; One firmware, four Heltec boards. The radio half is identical on all of them
; -- the SX1262 sits on the same seven pins across the ESP32-S3 range -- so the
; per-board differences are the display and the power switching, and those are
; the only things boards.h has to describe.
;
; Build one:
;     pio run -e heltec_vision_master_t190 -t upload
;     pio run -e heltec_vision_master_e290 -t upload
;     pio run -e heltec_wifi_lora_32_v4    -t upload
;     pio run -e heltec_wifi_lora_32_v4_headless -t upload
;
; Build all of them:  pio run

[env]
platform = espressif32
framework = arduino
board_build.mcu = esp32s3
board_build.f_cpu = 240000000L

build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=0

lib_deps =
    jgromes/RadioLib@^6.4.0
    adafruit/Adafruit GFX Library@^1.11.9
    adafruit/Adafruit BusIO@^1.15.0

monitor_speed = 921600
upload_speed = 921600
monitor_filters = esp32_exception_decoder


; ---------------------------------------------------------------------------
; Vision Master T190 -- 1.9" colour TFT. The original target.
; ---------------------------------------------------------------------------
[env:heltec_vision_master_t190]
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_opi
build_flags =
    ${env.build_flags}
    -DBOARD_VISION_MASTER_T190
    -DBOARD_HAS_PSRAM
lib_deps =
    ${env.lib_deps}
    adafruit/Adafruit ST7735 and ST7789 Library@^1.10.3


; ---------------------------------------------------------------------------
; WiFi LoRa 32 V4 -- 0.96" SSD1306 OLED.
; ---------------------------------------------------------------------------
[env:heltec_wifi_lora_32_v4]
board = esp32-s3-devkitc-1
build_flags =
    ${env.build_flags}
    -DBOARD_WIFI_LORA_32_V4
lib_deps =
    ${env.lib_deps}
    adafruit/Adafruit SSD1306@^2.5.9


; ---------------------------------------------------------------------------
; WiFi LoRa 32 V4 with no panel fitted, or one that has failed. Everything the
; modem actually does happens over USB; the display was only a convenience.
; ---------------------------------------------------------------------------
[env:heltec_wifi_lora_32_v4_headless]
board = esp32-s3-devkitc-1
build_flags =
    ${env.build_flags}
    -DBOARD_WIFI_LORA_32_V4_NODISPLAY


; ---------------------------------------------------------------------------
; WiFi LoRa 32 V3 -- 0.96" SSD1306 OLED.
;
; The most widely owned SX1262 board there is. Note the ADC control polarity
; differs from the V4; see boards.h.
; ---------------------------------------------------------------------------
[env:heltec_wifi_lora_32_v3]
board = esp32-s3-devkitc-1
build_flags =
    ${env.build_flags}
    -DBOARD_WIFI_LORA_32_V3
lib_deps =
    ${env.lib_deps}
    adafruit/Adafruit SSD1306@^2.5.9


; ---------------------------------------------------------------------------
; Wireless Stick Lite V3 -- no display.
;
; A good permanent ground station: nothing to burn in, nothing to draw current.
; ---------------------------------------------------------------------------
[env:heltec_wireless_stick_lite_v3]
board = esp32-s3-devkitc-1
build_flags =
    ${env.build_flags}
    -DBOARD_WIRELESS_STICK_LITE_V3


; ---------------------------------------------------------------------------
; LilyGO T3-S3 -- 0.96" SSD1306 OLED.
;
; The 868/915 MHz SX1262 version. LilyGO sells visually identical boards with
; an SX1276 and an SX1280; neither can do 96 kbps GFSK and neither will work.
; ---------------------------------------------------------------------------
[env:lilygo_t3s3]
board = esp32-s3-devkitc-1
build_flags =
    ${env.build_flags}
    -DBOARD_LILYGO_T3S3
lib_deps =
    ${env.lib_deps}
    adafruit/Adafruit SSD1306@^2.5.9


; ---------------------------------------------------------------------------
; Seeed XIAO ESP32-S3 with the Wio-SX1262 module -- no display.
;
; The only board here with an external RX switch rather than one driven from
; DIO2. boards.h defines RF_SWITCH_RX_PIN and the firmware wires it up.
; ---------------------------------------------------------------------------
[env:xiao_s3_wio_sx1262]
board = seeed_xiao_esp32s3
build_flags =
    ${env.build_flags}
    -DBOARD_XIAO_S3_WIO_SX1262
