; RaptorHab Ground Station Modem
;
; One firmware, four Heltec boards. The radio half is identical on all of them
; -- the SX1262 sits on the same seven pins across the ESP32-S3 range -- so the
; per-board differences are the display and the power switching, and those are
; the only things boards.h has to describe.
;
; Build one:
;     pio run -e heltec_vision_master_t190 -t upload
;     pio run -e heltec_vision_master_e290 -t upload
;     pio run -e heltec_wifi_lora_32_v4    -t upload
;     pio run -e heltec_wifi_lora_32_v4_headless -t upload
;
; Build all of them:  pio run

[env]
platform = espressif32
framework = arduino
board_build.mcu = esp32s3
board_build.f_cpu = 240000000L

build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=0

lib_deps =
    jgromes/RadioLib@^6.4.0
    adafruit/Adafruit GFX Library@^1.11.9
    adafruit/Adafruit BusIO@^1.15.0

monitor_speed = 921600
upload_speed = 921600
monitor_filters = esp32_exception_decoder


; ---------------------------------------------------------------------------
; Vision Master T190 -- 1.9" colour TFT. The original target.
; ---------------------------------------------------------------------------
[env:heltec_vision_master_t190]
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_opi
build_flags =
    ${env.build_flags}
    -DBOARD_VISION_MASTER_T190
    -DBOARD_HAS_PSRAM
lib_deps =
    ${env.lib_deps}
    adafruit/Adafruit ST7735 and ST7789 Library@^1.10.3


; ---------------------------------------------------------------------------
; Vision Master E290 -- 2.9" e-ink.
;
; The panel holds its last reading with the power off, which is the right
; behaviour for a modem left in a field, and it is refreshed at most once a
; minute because each refresh costs about two seconds and a little panel life.
; ---------------------------------------------------------------------------
[env:heltec_vision_master_e290]
board = esp32-s3-devkitc-1
board_build.partitions = default_8MB.csv
build_flags =
    ${env.build_flags}
    -DBOARD_VISION_MASTER_E290
lib_deps =
    ${env.lib_deps}
    zinggjm/GxEPD2@^1.5.8


; ---------------------------------------------------------------------------
; WiFi LoRa 32 V4 -- 0.96" SSD1306 OLED.
; ---------------------------------------------------------------------------
[env:heltec_wifi_lora_32_v4]
board = esp32-s3-devkitc-1
build_flags =
    ${env.build_flags}
    -DBOARD_WIFI_LORA_32_V4
lib_deps =
    ${env.lib_deps}
    adafruit/Adafruit SSD1306@^2.5.9


; ---------------------------------------------------------------------------
; WiFi LoRa 32 V4 with no panel fitted, or one that has failed. Everything the
; modem actually does happens over USB; the display was only a convenience.
; ---------------------------------------------------------------------------
[env:heltec_wifi_lora_32_v4_headless]
board = esp32-s3-devkitc-1
build_flags =
    ${env.build_flags}
    -DBOARD_WIFI_LORA_32_V4_NODISPLAY
